[theme]
base = "light"
primaryColor = "#0047AB"
backgroundColor = "#F1F2F4"
secondaryBackgroundColor = "#F8F9FA"
textColor = "#10131C"
borderColor = "#D5D8DF"
baseRadius = "large"
font = "Outfit:https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
